name: Build MeshConnect APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android Licenses
      run: |
        yes | sdkmanager --licenses || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Build APK
      run: |
        gradle assembleDebug --stacktrace > /tmp/gradle_log.txt 2>&1 || {
          python3 -c '
        with open("/tmp/gradle_log.txt", "r", errors="ignore") as f:
            lines = f.readlines()
        tail = "".join(lines[-40:])
        escaped = tail.replace("\r", "").replace("\n", "%0A")
        print(f"::error::{escaped}")
        '
          exit 1
        }

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MeshConnect-APK
        path: app/build/outputs/
        retention-days: 14
