name: Build MeshConnect APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android Licenses
      run: |
        yes | sdkmanager --licenses || true

    - name: Setup Gradle 8.7
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Build Debug APK
      run: |
        gradle :app:assembleDebug --stacktrace > build_error.txt 2>&1 || {
          echo "=== GRADLE ERROR TAIL ==="
          tail -n 100 build_error.txt
          git config user.name "BuildBot"
          git config user.email "bot@github.com"
          git checkout -B build-log-branch
          git add build_error.txt
          git commit -m "Upload build error log"
          git push -f origin build-log-branch
          exit 1
        }
        find . -name "*.apk"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: MeshConnect-APK
        path: '**/*.apk'
        retention-days: 14
