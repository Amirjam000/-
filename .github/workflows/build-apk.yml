name: Build MeshConnect APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android Licenses
      run: |
        yes | sdkmanager --licenses || true

    - name: Setup Gradle 8.7
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Build Debug APK
      run: |
        gradle assembleDebug --stacktrace 2>&1 | tee gradle_build_log.txt

    - name: Upload Build Log on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Gradle-Build-Log
        path: gradle_build_log.txt

    - name: Upload Debug APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: MeshConnect-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 14

    - name: Build Release APK
      if: success()
      run: |
        gradle assembleRelease --stacktrace || true

    - name: Upload Release APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: MeshConnect-Release-APK
        path: app/build/outputs/apk/release/*.apk
        retention-days: 14
