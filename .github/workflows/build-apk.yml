name: Build MeshConnect APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Make Gradlew Executable
      run: chmod +x ./gradlew

    - name: Build APK
      run: |
        mkdir -p /tmp/apk_artifacts
        ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/apk_artifacts/build_log.txt || true
        find . -name "*.apk" -exec cp {} /tmp/apk_artifacts/ \; || true
        echo "=== فایلهای آماده شده در /tmp/apk_artifacts ==="
        ls -la /tmp/apk_artifacts

    - name: Upload APK and Logs
      uses: actions/upload-artifact@v4
      with:
        name: MeshConnect-APK-Bundle
        path: /tmp/apk_artifacts/
        retention-days: 14
